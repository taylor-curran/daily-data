<!doctype html><html><head>
<link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Note Reading Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one centered card, staff image on top, single-letter answer box beneath, progress strip above. */
:root{
  --bg:#f7f5f0; --paper:#ffffff; --ink:#1f2430; --muted:#6b6f7a; --line:#d9d6ce;
  --accent:#2f5d8a; --ok:#2e7d4f; --bad:#b4423a;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171c;--paper:#1e2127;--ink:#e8e6e0;--muted:#9a9ea8;--line:#343842;--accent:#7fb0e0;--ok:#5fbf86;--bad:#e2716a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--paper:#1e2127;--ink:#e8e6e0;--muted:#9a9ea8;--line:#343842;--accent:#7fb0e0;--ok:#5fbf86;--bad:#e2716a;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0;text-wrap:balance}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.progress{display:flex;gap:6px}
.progress span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress span.ok{background:var(--ok)} .progress span.bad{background:var(--bad)} .progress span.cur{background:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px}
.card img{max-width:100%;width:300px;background:#fff;border-radius:6px}
form{display:flex;gap:10px;align-items:center}
input{width:4.5rem;height:3.5rem;font:600 2rem var(--display);text-align:center;text-transform:uppercase;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{height:3.5rem;padding:0 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:500 1rem var(--body);cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fb{min-height:1.5rem;font-size:1rem;font-weight:500}
.mic{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.mic button{height:2.4rem;padding:0 14px;font-size:.9rem;background:var(--accent);color:#fff;border:1px solid var(--accent)}
.mic button.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.heard{font-style:italic}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.done{text-align:center;font-family:var(--display);font-size:1.3rem}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:1rem}
.times{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem;text-align:center}
.times li{padding:8px 4px;border:1px solid var(--line);border-radius:6px}
.times li.ok{border-color:var(--ok)} .times li.bad{border-color:var(--bad)}
.times b{display:block;font-family:var(--display);font-size:1.2rem}
.hint{color:var(--muted);font-size:.85rem;text-align:center}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
<main>
  <h1>Note Reading Drill</h1>
  <div class="meta"><span>Treble clef · 5-card test</span><span class="timer" id="timer">0.0s</span><span id="score">0 / 5</span></div>
  <div class="progress" id="prog"></div>
  <div class="card" id="card">
    <img id="img" alt="Staff with one note">
    <form id="f" autocomplete="off">
      <input id="ans" maxlength="1" aria-label="Note letter" placeholder="?">
      <button type="submit" id="go">Check</button>
    </form>
    <div class="fb" id="fb"></div>
  </div>
  <div class="mic"><button type="button" id="micBtn">🎤 Turn on voice</button><span id="heard" class="heard"></span></div>
  <p class="hint" id="hint">Press Start (or say “start”), then type the letter and press Enter — or tap “Turn on voice” and say the note (“D” or “D note”). Voice runs on your device; the first time it downloads a ~40 MB voice model.</p>
</main>

let i=0, right=0, state='ready', res=[], times=[], t0=0, tick=null;
const timerEl=document.getElementById('timer');
const fmt=ms=>(ms/1000).toFixed(1)+'s';
function startTimer(){t0=performance.now(); clearInterval(tick); tick=setInterval(()=>timerEl.textContent=fmt(performance.now()-t0),100); timerEl.textContent='0.0s';}
function stopTimer(){clearInterval(tick); const ms=performance.now()-t0; times[i]=ms; timerEl.textContent=fmt(ms); return ms;}
const card=document.getElementById('card'), CARD_HTML=card.innerHTML,
      prog=document.getElementById('prog'), score=document.getElementById('score');
let img, ans, fb, f, go;
function bindCard(){
  img=document.getElementById('img'); ans=document.getElementById('ans'); fb=document.getElementById('fb');
  f=document.getElementById('f'); go=document.getElementById('go');
  f.addEventListener('submit',e=>{
    e.preventDefault();
    if(state==='ready') begin();
    else if(state==='ask') check(ans.value.trim().toUpperCase());
    else { i++; show(); }
  });
}
function drawProg(){prog.innerHTML=CARDS.map((_,k)=>`<span class="${res[k]||(k===i&&state!=='ready'?'cur':'')}"></span>`).join('')}
function ready(){
  i=0; right=0; res=[]; times=[]; state='ready'; clearInterval(tick);
  card.innerHTML=CARD_HTML; bindCard();
  img.removeAttribute('src'); img.style.visibility='hidden';
  ans.disabled=true; go.textContent='Start'; fb.className='fb';
  fb.textContent=voiceOn?'Say “start” when you’re ready':'Press Start (or turn on voice and say “start”)';
  timerEl.textContent='0.0s'; score.textContent=`0 / ${CARDS.length}`; drawProg(); go.focus();
}
function begin(){ if(state!=='ready') return; img.style.visibility=''; show(); }
function show(){
  if(i>=CARDS.length){
    const avg=times.reduce((a,b)=>a+b,0)/times.length;
    card.innerHTML=`<div class="done">${right} of ${CARDS.length} correct · avg ${fmt(avg)}</div><ul class="times">${CARDS.map((c,k)=>`<li class="${res[k]}"><b>${c.a}</b>${fmt(times[k])}</li>`).join('')}</ul><button type="button" id="again">Again</button>`;
    state='done'; timerEl.textContent=''; drawProg();
    const ag=document.getElementById('again'); ag.onclick=ready; ag.focus(); return}
  img.src=CARDS[i].img; ans.value=''; ans.disabled=false; fb.textContent=''; fb.className='fb'; go.textContent='Check'; state='ask'; drawProg(); ans.focus(); startTimer();
}
function check(v){
  if(state!=='ask'||!v) return;
  const ms=stopTimer();
  const ok=v===CARDS[i].a; res[i]=ok?'ok':'bad'; if(ok) right++;
  ans.value=v; fb.textContent=(ok?'Correct':`It's ${CARDS[i].a}`)+` · ${fmt(ms)}`; fb.className='fb '+(ok?'ok':'bad');
  score.textContent=`${right} / ${CARDS.length}`; ans.disabled=true; go.textContent='Next'; state='next'; drawProg(); go.focus();
}
document.addEventListener('keydown',e=>{ if(state==='next' && e.key==='Enter'){e.preventDefault(); i++; show();} });

// ---- voice ----
// Primary engine: Vosk running locally in the browser with a tiny grammar (letters + a few commands).
// Fallback: Chrome's built-in SpeechRecognition (add ?engine=chrome to force it).
const micBtn=document.getElementById('micBtn'), heard=document.getElementById('heard');
const MAP={a:'A',ay:'A',hey:'A',hay:'A',eh:'A',aye:'A',
  b:'B',be:'B',bee:'B',bea:'B',
  c:'C',see:'C',sea:'C',si:'C',cee:'C',
  d:'D',de:'D',dee:'D',di:'D',the:'D',thee:'D',tee:'D',tea:'D',dea:'D',deep:'D',
  e:'E',ee:'E',eee:'E',he:'E',ye:'E',yi:'E',eve:'E',eat:'E',ease:'E',eek:'E',ie:'E',iii:'E',ii:'E',
  f:'F',ef:'F',eff:'F',if:'F',
  g:'G',gee:'G',jee:'G',ji:'G',je:'G',gi:'G'};
const START_RE=/\b(start|starting|started|begin|go|ready|again)\b/i;
const VOSK_GRAMMAR=["a","ay","b","bee","c","see","sea","d","dee","e","f","ef","eff","g","gee","jee","note","start","begin","again","[unk]"];
function toLetter(s){
  const words=s.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean);
  for(let k=words.length-1;k>=0;k--){ if(MAP[words[k]]) return MAP[words[k]]; }
  return null;
}
let voiceOn=false, engine=null;
function setMicUI(on){ voiceOn=on; micBtn.classList.toggle('on',on); micBtn.textContent=on?'🎤 Listening · tap to stop':'🎤 Turn on voice'; }
function promptText(){ return state==='ready'?'say “start”':state==='done'?'say “again”':'say the note'; }
function answer(letter){
  if(state!=='ask') return;
  check(letter);
  engine&&engine.reset();
  setTimeout(()=>{ if(state==='next'){ i++; show(); engine&&engine.reset(); } },900);
}
// Shared handler for both engines. final=true means the recognizer thinks the utterance ended.
let pend=null, pendL=null;
function onSpeech(txt, final){
  txt=(txt||'').trim();
  if(state==='ready'||state==='done'){
    if(START_RE.test(txt)){ clearTimeout(pend); pend=null; if(state==='done') ready(); begin(); engine&&engine.reset(); }
    else if(txt) heard.textContent='“'+txt+'” — '+promptText();
    return;
  }
  if(state!=='ask') return;
  if(!txt) return;
  heard.textContent='“'+txt+'”';
  const L=toLetter(txt);
  if(!L){ if(final) heard.textContent='“'+txt+'” — not a note, try “'+CARDS[i].a.replace(/./,'X')+' note”'; return; }
  // Answer immediately on a final result or "X note"; otherwise wait briefly in case a partial is revised (bee→dee).
  if(final || /\bnote\b/i.test(txt)){ clearTimeout(pend); pend=null; answer(L); return; }
  if(L!==pendL){ clearTimeout(pend); pendL=L; pend=setTimeout(()=>{ pend=null; pendL=null; answer(L); },220); }
}

function voskEngine(){
  let model=null, loading=null, ctx=null, stream=null, src=null, node=null, rec=null;
  const MODEL_URL=new URL('models/vosk-model-small-en-us-0.15.tar.gz', location.href).href;
  function load(){
    if(!loading){
      loading=cachedModelUrl().then(u=>Vosk.createModel(u)).then(m=>{ model=m; return m; })
        .catch(err=>{ loading=null; throw err||new Error('model failed to load'); });
    }
    return loading;
  }
  // Keep the ~40 MB model in the Cache API so it only downloads once.
  async function cachedModelUrl(){
    if(!window.caches) return MODEL_URL;
    try{
      const c=await caches.open('vosk-model-v1');
      let r=await c.match(MODEL_URL);
      if(!r){ await c.add(MODEL_URL); r=await c.match(MODEL_URL); }
      return URL.createObjectURL(await r.blob());
    }catch(_){ return MODEL_URL; }
  }
  function newRec(){
    if(rec){ try{rec.remove()}catch(_){} }
    const r=new model.KaldiRecognizer(ctx.sampleRate, JSON.stringify(VOSK_GRAMMAR));
    r.on('partialresult',m=>{ if(r===rec) onSpeech(m.result.partial.replace(/\[unk\]/g,''),false); });
    r.on('result',m=>{ if(r===rec) onSpeech(m.result.text.replace(/\[unk\]/g,''),true); });
    rec=r;
  }
  return {
    name:'offline',
    preload(){ return load().catch(()=>{}); },
    async start(){
      if(!model){ heard.textContent='loading voice model (one-time ~40 MB)…'; await load(); }
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
      ctx=new AudioContext();
      src=ctx.createMediaStreamSource(stream);
      node=ctx.createScriptProcessor(2048,1,1);
      node.onaudioprocess=e=>{ if(rec) try{ rec.acceptWaveform(e.inputBuffer) }catch(_){} };
      src.connect(node); node.connect(ctx.destination);
      newRec();
      heard.textContent='mic ready — '+promptText();
    },
    stop(){
      if(rec){ try{rec.remove()}catch(_){} rec=null; }
      try{node&&node.disconnect(); src&&src.disconnect();}catch(_){}
      stream&&stream.getTracks().forEach(t=>t.stop()); ctx&&ctx.close();
      ctx=stream=src=node=null;
    },
    reset(){ clearTimeout(pend); pend=null; pendL=null; if(rec&&model&&ctx) newRec(); }
  };
}

function chromeEngine(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  const rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang='en-US'; rec.maxAlternatives=5;
  rec.onresult=e=>{
    for(let k=e.resultIndex;k<e.results.length;k++){
      const r=e.results[k];
      for(let a=0;a<r.length;a++){
        const t=r[a].transcript;
        if((state==='ask'&&toLetter(t))||((state==='ready'||state==='done')&&START_RE.test(t))){ onSpeech(t,true); return; }
      }
      onSpeech(r[0].transcript,r.isFinal);
    }
  };
  rec.onaudiostart=()=>{ heard.textContent='mic ready — '+promptText(); };
  rec.onend=()=>{ if(voiceOn) try{rec.start()}catch(_){} };
  rec.onerror=e=>{ if(e.error==='aborted'||e.error==='no-speech') return; heard.textContent='mic error: '+e.error; if(e.error==='not-allowed') setMicUI(false); };
  return { name:'chrome', preload(){}, start(){ heard.textContent='warming up…'; rec.start(); }, stop(){ rec.stop(); }, reset(){ clearTimeout(pend); pend=null; pendL=null; try{rec.abort()}catch(_){} } };
}

const forceChrome=new URLSearchParams(location.search).get('engine')==='chrome';
const hasVosk=!forceChrome && window.Vosk && window.WebAssembly && navigator.mediaDevices && window.AudioContext;
engine=hasVosk?voskEngine():chromeEngine();
if(!engine){ micBtn.disabled=true; micBtn.textContent='Voice unsupported'; heard.textContent='This browser can’t do voice here. Type the letter instead.'; }
else{
  engine.preload();
  micBtn.onclick=async()=>{
    if(voiceOn){ setMicUI(false); heard.textContent=''; engine.stop(); return; }
    setMicUI(true);
    if(state==='ready') fb.textContent='Say “start” when you’re ready';
    try{ await engine.start(); }
    catch(err){
      setMicUI(false);
      const msg=(err&&(err.name||err.message))||'unknown error';
      if(engine.name==='offline' && !/NotAllowed|Permission/i.test(msg)){
        const c=chromeEngine();
        if(c){ engine=c; heard.textContent='offline voice failed ('+msg+') — switched to Chrome voice, tap again'; return; }
      }
      heard.textContent='mic error: '+msg;
    }
  };
}
ready();
</script>
</body></html>
