# daily-data config — the ONLY place habits, measures and arcs are defined.
#
# Conversations never change this file. Edit it here and push; Vercel redeploys and syncs on boot.
# Removing something deactivates it (history is kept). Everything that *happens* — entries,
# action items, todos, content, notes — is data and is written by conversations.
#
# Five kinds of things:
#   habits    yes/no adherence against a cadence            ("did you?")
#   measures  a daily number you want to see trend           ("how many?")
#   arcs      a static objective + rotating action items     ("what moved? what's next?")
#   todos     one-off housekeeping                           (data only, nothing to configure)
#   content   what you read/listened to that stuck           (data only)

modes: [home, office, weekend, travel]

# Physical things a day may or may not have. Checked against variant `requires`.
resources: [piano, gym, trainer]
default_available:
  home: [piano, gym, trainer]
  office: [piano, gym]
  weekend: [piano, gym]
  travel: []

# ---------------------------------------------------------------- habits
#
# cadence:  daily | every_N_days | Nx/week | Nx/2weeks | Nx/month
# track:    adherence (default; drift flag when below cadence) | count (just count it, no drift flag)
# modes:    where the habit is expected; omit travel to make travel exempt for it
# default:  variant key to lead with, or "progress" = most-overdue progress focus (needs rotation)
# target:   free text shown at debrief, e.g. the piece being learned

habits:
  piano_flashcards:
    name: Piano flashcards
    group: piano
    cadence: daily
    modes: [home, office, weekend, travel]     # phone app — no excuse
    variants:
      - {id: done, name: Flashcards session, requires: []}

  piano_drills:
    name: Piano drills
    group: piano
    cadence: 3x/week
    modes: [home, office, weekend]
    rotation: least_recent_focus
    default: progress
    variants:
      - {id: fingerpower, name: Fingerpower,       requires: [piano], kind: progress, focus: fingerpower}
      - {id: scales,      name: Scales,            requires: [piano], kind: progress, focus: scales}
      - {id: rhythm,      name: Rhythm exercises,  requires: [piano], kind: progress, focus: rhythm}

  piano_app:
    name: Piano app song
    group: piano
    cadence: 3x/week
    modes: [home, office, weekend]
    variants:
      - {id: new_song, name: New micro song in the app, requires: [piano]}

  piano_piece:
    name: Piano piece
    group: piano
    active: false            # flip on when flashcards feel solid; set `target` to the piece
    target: ""
    cadence: 2x/week
    modes: [home, office, weekend]
    variants:
      - {id: practice, name: Work on the piece, requires: [piano], kind: progress}

  strength:
    name: Strength
    cadence: 3x/week          # later: per-exercise logging (split squats @ N lbs) as measures
    modes: [home, office, weekend]
    default: progress
    variants:
      - {id: trainer,    name: Session with trainer,  requires: [trainer], kind: progress}
      - {id: solo_gym,   name: Solo strength session, requires: [gym],     kind: progress}
      - {id: one_pullup, name: One pullup,            requires: []}

  climbing:
    name: Climbing
    cadence: 1x/week          # soft aim; track=count means no drift flag, just the weekly number
    track: count
    modes: [home, office, weekend]
    variants:
      - {id: brigid, name: With Brigid, requires: []}
      - {id: noah,   name: With Noah,   requires: []}
      - {id: other,  name: Other,       requires: []}

  ovasitol:
    name: Ovasitol
    group: supplements
    cadence: daily
    modes: [home, office, weekend, travel]
    anchor: after shower, with eye cream
    variants:
      - {id: taken, name: Taken, requires: []}

  saline:
    name: Saline rinse
    cadence: every_2_days
    modes: [home, office, weekend]
    variants:
      - {id: rinse, name: Rinse, requires: []}

  veggies:
    name: Veggies
    cadence: daily
    modes: [home, office, weekend]
    variants:
      - {id: had, name: Had veggies today (pickled counts), requires: []}

# ---------------------------------------------------------------- measures
#
# kind: count (a number) | scale (pick a level; stored as its index)
# direction: which way is good — the review reports the trend, it doesn't nag

measures:
  picking:
    name: Skin picking
    kind: count
    unit: instances
    direction: down
    modes: [home, office, weekend, travel]
  phone_video:
    name: Phone video time
    kind: scale
    levels: [none, some, a lot]
    direction: down
    modes: [home, office, weekend, travel]

# ---------------------------------------------------------------- arcs
#
# objective: static; what the arc is for. Action items are data — add/finish/drop them in conversation.
# seed_items: inserted ONCE, the first time the arc is created. Edit items in conversation after that.
# status: active | backburner | done. The review suggests backburner after 3 quiet weeks; you flip it here.

arcs:
  AD:
    name: Austin Dynamism
    priority: top
    status: active
    objective: Strong engineers choose TerraFirma and Austin — through relationships, hosting, and a pitch I can deliver cold.
    seed_items:
      - Listen to CEO interviews; save favorite soundbites on competitive edge / why TF (maybe a flashcard deck)
      - Help Noah build the presentation for Thursday's UT student event
      - Set up an agent skill that finds relevant Austin tech events
      - Schedule meetings with students on campus
      - Pre-research candidates and draft mock technical screening questions; get Noah's feedback (ask him to record screens)

  WEDDING:
    name: Wedding & family
    priority: high
    status: active
    objective: Plan the wedding.
    seed_items:
      - Book a wedding venue

  NS:
    name: Noah System
    status: backburner
    objective: Be concretely useful to the TF eng team with tooling I already know (bug tracker + Devin).

  ER:
    name: Ed Robot
    status: backburner
    objective: Learn robotics for its own sake. Does not count as AD work.
