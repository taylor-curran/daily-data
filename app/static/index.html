<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daily-data</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#244A40; --fg:#FFF6EA; --accent:#F2C76E; --leaf:#9BD08F; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
         display:grid; place-items:center; padding:16px; box-sizing:border-box; }
  main { text-align:center; max-width:420px; }
  img { width:96px; height:96px; border-radius:24px; }
  h1 { font-size:28px; font-weight:600; margin:16px 0 4px; }
  p { margin:0; opacity:.85; }
  .status { margin-top:20px; font-size:14px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:middle; }
  .dot.ok { background:var(--leaf); }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>Hello, world</h1>
  <p>daily-data</p>
  <p class="status"><span class="dot" id="dot"></span><span id="msg">checking server…</span></p>
</main>
<script>
  fetch('/health').then(r => r.json()).then(j => {
    document.getElementById('dot').classList.toggle('ok', !!j.ok);
    document.getElementById('msg').textContent = j.ok ? 'server is up' : 'server responded oddly';
  }).catch(() => { document.getElementById('msg').textContent = 'server unreachable'; });
</script>
</body>
</html>
